<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">One-line project progress timeline</title>
  <desc id="desc">A single 0 to 100 percent timeline with ALvoix at 45 percent, Kemlha at 60 percent, and MathSpace at 65 percent.</desc>

  <rect x="0.5" y="0.5" width="959" height="179" rx="16" fill="#000000" stroke="#252525"/>

  <text x="32" y="31" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" letter-spacing="1.7">PROJECT PROGRESS</text>
  <text x="928" y="31" fill="#666666" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" text-anchor="end">INDEPENDENT 0 — 100%</text>

  <g stroke="#1f1f1f" stroke-width="1">
    <line x1="40" y1="84" x2="40" y2="100"/>
    <line x1="260" y1="84" x2="260" y2="100"/>
    <line x1="480" y1="84" x2="480" y2="100"/>
    <line x1="700" y1="84" x2="700" y2="100"/>
    <line x1="920" y1="84" x2="920" y2="100"/>
  </g>

  <line x1="40" y1="92" x2="920" y2="92" stroke="#303030" stroke-width="4" stroke-linecap="round"/>

  <g stroke="#6b6b6b" stroke-width="1">
    <line x1="436" y1="69" x2="436" y2="84"/>
    <line x1="568" y1="100" x2="568" y2="115"/>
    <line x1="612" y1="69" x2="612" y2="84"/>
  </g>

  <g fill="#000000" stroke="#f5f5f5" stroke-width="2">
    <circle cx="436" cy="92" r="7"/>
    <circle cx="568" cy="92" r="7"/>
    <circle cx="612" cy="92" r="7"/>
  </g>

  <g fill="#f5f5f5">
    <circle cx="436" cy="92" r="2"/>
    <circle cx="568" cy="92" r="2"/>
    <circle cx="612" cy="92" r="2"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="436" y="51" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">ALvoix</text>
    <text x="436" y="67" fill="#8a8a8a" font-size="12" text-anchor="middle">45%</text>

    <text x="612" y="51" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">MathSpace</text>
    <text x="612" y="67" fill="#8a8a8a" font-size="12" text-anchor="middle">65%</text>

    <text x="568" y="132" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">Kemlha</text>
    <text x="568" y="148" fill="#8a8a8a" font-size="12" text-anchor="middle">60%</text>

    <text x="40" y="123" fill="#666666" font-size="10">0%</text>
    <text x="920" y="123" fill="#666666" font-size="10" text-anchor="end">100%</text>
  </g>
</svg>