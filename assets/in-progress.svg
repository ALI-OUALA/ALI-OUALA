<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 168" role="img" aria-labelledby="title desc">
  <title id="title">Current focus allocation</title>
  <desc id="desc">ALvoix 40 percent, MathSpace 35 percent, Kemlha 25 percent.</desc>

  <rect x="0.5" y="0.5" width="959" height="167" rx="16" fill="#0d1117" stroke="#30363d"/>

  <text x="32" y="36" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" letter-spacing="1.8">CURRENT FOCUS</text>
  <text x="928" y="36" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" text-anchor="end">100%</text>

  <defs>
    <clipPath id="bar">
      <rect x="32" y="56" width="896" height="20" rx="10"/>
    </clipPath>
  </defs>

  <rect x="32" y="56" width="896" height="20" rx="10" fill="#21262d"/>
  <g clip-path="url(#bar)">
    <rect x="32" y="56" width="358.4" height="20" fill="#a78bfa"/>
    <rect x="390.4" y="56" width="313.6" height="20" fill="#60a5fa"/>
    <rect x="704" y="56" width="224" height="20" fill="#fbbf24"/>
  </g>

  <line x1="390.4" y1="56" x2="390.4" y2="76" stroke="#0d1117" stroke-width="3"/>
  <line x1="704" y1="56" x2="704" y2="76" stroke="#0d1117" stroke-width="3"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">
    <circle cx="32" cy="120" r="5" fill="#a78bfa"/>
    <text x="48" y="125" fill="#f0f6fc" font-weight="600">ALvoix</text>
    <text x="300" y="125" fill="#8b949e" text-anchor="end">40%</text>

    <circle cx="340" cy="120" r="5" fill="#60a5fa"/>
    <text x="356" y="125" fill="#f0f6fc" font-weight="600">MathSpace</text>
    <text x="608" y="125" fill="#8b949e" text-anchor="end">35%</text>

    <circle cx="648" cy="120" r="5" fill="#fbbf24"/>
    <text x="664" y="125" fill="#f0f6fc" font-weight="600">Kemlha</text>
    <text x="928" y="125" fill="#8b949e" text-anchor="end">25%</text>
  </g>

  <text x="32" y="151" fill="#6e7681" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">A moving allocation of attention, not a completion score.</text>
</svg>