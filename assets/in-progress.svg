<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">One-line project progress timeline with project icons</title>
  <desc id="desc">A monochrome 0 to 100 percent timeline with Inspra at 80 percent, ALvoix at 45 percent, and Kemlha at 60 percent.</desc>

  <rect x="0.5" y="0.5" width="959" height="219" rx="16" fill="#000000" stroke="#252525"/>

  <text x="32" y="31" fill="#8a8a8a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" letter-spacing="1.7">PROJECT PROGRESS</text>
  <text x="928" y="31" fill="#666666" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" text-anchor="end">INDEPENDENT 0 — 100%</text>

  <!-- callout connectors -->
  <g stroke="#5f5f5f" stroke-width="1">
    <line x1="744" y1="114" x2="744" y2="128"/>
    <line x1="436" y1="114" x2="436" y2="128"/>
    <line x1="568" y1="114" x2="568" y2="128"/>
  </g>

  <!-- project callouts -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <!-- Inspra / spark -->
    <rect x="728" y="46" width="32" height="32" rx="9" fill="#0d0d0d" stroke="#2d2d2d"/>
    <g fill="none" stroke="#f5f5f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M744 51l2.5 7.5L754 61l-7.5 2.5L744 71l-2.5-7.5L734 61l7.5-2.5z"/>
      <path d="M754 52l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/>
    </g>
    <text x="744" y="96" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">Inspra</text>
    <text x="744" y="112" fill="#8a8a8a" font-size="12" text-anchor="middle">30%</text>

    <!-- ALvoix / microphone -->
    <rect x="420" y="46" width="32" height="32" rx="9" fill="#0d0d0d" stroke="#2d2d2d"/>
    <g fill="none" stroke="#f5f5f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="431" y="52" width="10" height="15" rx="5"/>
      <path d="M428 63a8 8 0 0 0 16 0"/>
      <line x1="436" y1="71" x2="436" y2="74"/>
      <line x1="432" y1="74" x2="440" y2="74"/>
    </g>
    <text x="436" y="96" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">ALvoix</text>
    <text x="436" y="112" fill="#8a8a8a" font-size="12" text-anchor="middle">45%</text>

    <!-- Kemlha / package -->
    <rect x="552" y="46" width="32" height="32" rx="9" fill="#0d0d0d" stroke="#2d2d2d"/>
    <g fill="none" stroke="#f5f5f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M559 56l9-4 9 4-9 4-9-4z"/>
      <path d="M559 56v11l9 5 9-5V56"/>
      <path d="M568 60v12"/>
      <path d="M563 54l9 4 5-2"/>
    </g>
    <text x="568" y="96" fill="#f5f5f5" font-size="14" font-weight="600" text-anchor="middle">Kemlha</text>
    <text x="568" y="112" fill="#8a8a8a" font-size="12" text-anchor="middle">60%</text>
  </g>

  <!-- single timeline -->
  <g stroke="#1f1f1f" stroke-width="1">
    <line x1="40" y1="127" x2="40" y2="143"/>
    <line x1="260" y1="127" x2="260" y2="143"/>
    <line x1="480" y1="127" x2="480" y2="143"/>
    <line x1="700" y1="127" x2="700" y2="143"/>
    <line x1="920" y1="127" x2="920" y2="143"/>
  </g>

  <line x1="40" y1="135" x2="920" y2="135" stroke="#303030" stroke-width="4" stroke-linecap="round"/>

  <g fill="#000000" stroke="#f5f5f5" stroke-width="2">
    <circle cx="744" cy="135" r="7"/>
    <circle cx="436" cy="135" r="7"/>
    <circle cx="568" cy="135" r="7"/>
  </g>

  <g fill="#f5f5f5">
    <circle cx="744" cy="135" r="2"/>
    <circle cx="436" cy="135" r="2"/>
    <circle cx="568" cy="135" r="2"/>
  </g>

  <g fill="#666666" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10">
    <text x="40" y="163">0%</text>
    <text x="480" y="163" text-anchor="middle">50%</text>
    <text x="920" y="163" text-anchor="end">100%</text>
  </g>
</svg>