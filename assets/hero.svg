<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-label="Ouala Eddine → production products and technical experiments → Algiers, Algeria">
<title>Ouala Eddine</title>

<defs>
  <style>
    /* ── greyscale ramp ─────────────────────────────────────────────
       #0d1117 canvas (GitHub's own, so the card sits flush on a dark
       profile) · #ffffff → #2b2b2b neutral ink. No hues anywhere.    */

    .moonline{font:14px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:currentColor}
    .title{font:700 58px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:url(#titleFill)}
    .titleGlow{font:700 58px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#fff}
    .prompt{font:13px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#6e6e6e}
    .sigil{fill:#e8e8e8}
    .meta{font:13px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#6e6e6e}
    .coord{font:11px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#4a4a4a}
    .motto{font:13px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#cfcfcf;text-anchor:middle}
    .glyph{font:13px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#fff}
    .star{fill:#fff}

    /* ── ambient AI: a net and an attention row, sized like starlight ── */
    .syn line{stroke:#fff;stroke-width:.75}
    .syn{opacity:.13}
    .node circle{fill:#fff}
    .node{opacity:.5}
    .attn .arc{fill:none;stroke:#fff;opacity:.18}
    .attn .tok{fill:#fff;opacity:.4}
    .attn .q{opacity:.8}

    .y1{animation:fire 9s ease-in-out infinite}
    .y2{animation:fire 9s 1s ease-in-out infinite}
    .n1{animation:lift 9s ease-in-out infinite}
    .n2{animation:lift 9s .7s ease-in-out infinite}
    .n3{animation:lift 9s 1.4s ease-in-out infinite}
    @keyframes fire{0%,60%,100%{opacity:.08}12%{opacity:.3}}
    @keyframes lift{0%,60%,100%{opacity:.34}12%{opacity:.9}}
    .a1{animation:weigh 11s ease-in-out infinite}
    .a2{animation:weigh 11s 1.4s ease-in-out infinite}
    .a3{animation:weigh 11s 2.6s ease-in-out infinite}
    .a4{animation:weigh 11s 3.8s ease-in-out infinite}
    @keyframes weigh{0%,55%,100%{opacity:.12}14%{opacity:.34}}

    /* ── sky ──────────────────────────────────────────────────────── */
    .s1{animation:tw 5.2s ease-in-out infinite}
    .s2{animation:tw 6.8s .9s ease-in-out infinite}
    .s3{animation:tw 4.1s 1.7s ease-in-out infinite}
    .s4{animation:tw 7.6s 2.4s ease-in-out infinite}
    .s5{animation:tw 5.9s 3.3s ease-in-out infinite}
    .s6{animation:tw 8.4s .4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}

    .moonWrap{animation:drift 12s ease-in-out infinite}
    @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

    .orbitSpin{transform-box:view-box;transform-origin:0 0;animation:spin 40s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .meteor{opacity:0}
    .m1{animation:shoot 16s 3.2s ease-in infinite}
    .m2{animation:shoot 23s 12s ease-in infinite}
    @keyframes shoot{
      0%,4%{opacity:0;transform:translate(-90px,-46px)}
      6%{opacity:1}
      13%,100%{opacity:0;transform:translate(210px,108px)}
    }

    /* ── entrance: every base state IS the finished state, so
          prefers-reduced-motion simply shows the composed frame ──── */
    .typeBar{transform-box:view-box;transform-origin:566px 0;animation:type 1s .25s steps(12,end) both}
    @keyframes type{from{transform:scaleX(0)}}

    .rise{animation:rise .8s cubic-bezier(.2,.75,.2,1) both}
    .r1{animation-delay:1.15s}.r2{animation-delay:1.3s}.r3{animation-delay:1.55s}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}}

    .rule{stroke-dashoffset:0;animation:draw 1.1s 1.25s cubic-bezier(.3,.8,.3,1) both}
    @keyframes draw{from{stroke-dashoffset:372}}

    .cursor{animation:blink 1.1s steps(1,end) infinite}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}

    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <clipPath id="card"><rect width="1200" height="430" rx="24"/></clipPath>

  <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".55" stop-color="#ededed"/>
    <stop offset="1" stop-color="#a4a4a4"/>
  </linearGradient>

  <radialGradient id="moonFill" gradientUnits="userSpaceOnUse" cx="196" cy="140" r="290">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".3" stop-color="#e2e2e2"/>
    <stop offset=".58" stop-color="#949494"/>
    <stop offset=".82" stop-color="#4e4e4e"/>
    <stop offset="1" stop-color="#2f2f2f"/>
  </radialGradient>

  <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="238" cy="186" r="215">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
    <stop offset=".45" stop-color="#ffffff" stop-opacity=".05"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="600" cy="215" r="700">
    <stop offset=".45" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".8"/>
  </radialGradient>

  <linearGradient id="divider" gradientUnits="userSpaceOnUse" x1="500" y1="96" x2="500" y2="336">
    <stop offset="0" stop-color="#3a3a3a" stop-opacity="0"/>
    <stop offset=".5" stop-color="#3a3a3a" stop-opacity="1"/>
    <stop offset="1" stop-color="#3a3a3a" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="ruleFill" gradientUnits="userSpaceOnUse" x1="568" y1="0" x2="940" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity=".85"/>
  </linearGradient>

  <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="glowTitle" x="-8%" y="-45%" width="116%" height="190%">
    <feGaussianBlur stdDeviation="3.2"/>
  </filter>
  <filter id="glowDot" x="-400%" y="-400%" width="900%" height="900%">
    <feGaussianBlur stdDeviation="2.4"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>

  <!-- the ASCII moon: authored once, reused as artwork and as its own mask -->
  <g id="moonArt" xml:space="preserve">
      <text x="64" y="48.0" class="moonline"></text>
      <text x="64" y="63.1" class="moonline">               ==+++++===-:</text>
      <text x="64" y="78.2" class="moonline">            =+++**+**++++==-:.</text>
      <text x="64" y="93.3" class="moonline">           +***##*****+*+=+=--:</text>
      <text x="64" y="108.4" class="moonline">          +*#*######*#**+++=--:.</text>
      <text x="64" y="123.5" class="moonline">         +*###%#*#%####*+++==--:.</text>
      <text x="64" y="138.6" class="moonline">        +*#####+-+#####***+==--::.</text>
      <text x="64" y="153.7" class="moonline">       ++*###%%#*#####*#*+++=--:...</text>
      <text x="64" y="168.8" class="moonline">       +*####%##%####***=-=+==-:...</text>
      <text x="64" y="183.9" class="moonline">       +*#*####%%####**#+=++==-::..</text>
      <text x="64" y="199.0" class="moonline">       +***#%########***+++===-::..</text>
      <text x="64" y="214.1" class="moonline">       +**#*=*%#####*#**++===-:::..</text>
      <text x="64" y="229.2" class="moonline">       ++*#########****+++===-::...</text>
      <text x="64" y="244.3" class="moonline">       ==+***###*+=+**+++===-:::...</text>
      <text x="64" y="259.4" class="moonline">       -=+++***#+=:=+*++===--::....</text>
      <text x="64" y="274.5" class="moonline">        ===++++*+===+++=-=:..:....</text>
      <text x="64" y="289.6" class="moonline">         -=++=++++++====---::....</text>
      <text x="64" y="304.7" class="moonline">          -=========-=----:.....</text>
      <text x="64" y="319.8" class="moonline">           :--=--=----::::.....</text>
      <text x="64" y="334.9" class="moonline">            .:::--::::........</text>
      <text x="64" y="350.0" class="moonline">               ............</text>
  </g>
  <mask id="moonMask"><use xlink:href="#moonArt" href="#moonArt" color="#fff"/></mask>

  <mask id="typeMask" maskUnits="userSpaceOnUse" x="540" y="128" width="540" height="80">
    <rect class="typeBar" x="566" y="128" width="500" height="80" fill="#fff"/>
  </mask>
</defs>

<g clip-path="url(#card)">
  <rect width="1200" height="430" fill="#0d1117"/>

  <g aria-hidden="true">
    <text x="1109.8" y="407.9" class="glyph s1" opacity="0.49">.</text>
    <text x="636.1" y="56.0" class="glyph s2" opacity="0.4">+</text>
    <circle cx="505.5" cy="220.4" r="1.39" class="star s6" opacity="0.34"/>
    <circle cx="206.3" cy="92.9" r="1.38" class="star s6" opacity="0.43"/>
    <text x="377.3" y="36.9" class="glyph s4" opacity="0.57">·</text>
    <circle cx="536.9" cy="276.2" r="1.18" class="star s2" opacity="0.61"/>
    <circle cx="130.9" cy="387.1" r="1.4" class="star s5" opacity="0.54"/>
    <circle cx="310.1" cy="46.1" r="1.45" class="star s1" opacity="0.36"/>
    <text x="28.0" y="348.1" class="glyph s6" opacity="0.66">*</text>
    <circle cx="1138.6" cy="231.6" r="1.01" class="star s4" opacity="0.79"/>
    <text x="452.4" y="83.1" class="glyph s1" opacity="0.64">*</text>
    <circle cx="120.0" cy="70.9" r="1.01" class="star s1" opacity="0.74"/>
    <circle cx="976.5" cy="384.9" r="0.76" class="star s6" opacity="0.78"/>
    <circle cx="1077.1" cy="320.7" r="1.07" class="star s5" opacity="0.67"/>
    <text x="991.8" y="46.6" class="glyph s6" opacity="0.41">·</text>
    <circle cx="1141.8" cy="33.8" r="1.32" class="star s5" opacity="0.29"/>
    <circle cx="785.5" cy="320.7" r="1.08" class="star s1" opacity="0.38"/>
    <circle cx="864.5" cy="76.4" r="0.97" class="star s5" opacity="0.74"/>
    <circle cx="503.5" cy="351.1" r="1.38" class="star s4" opacity="0.73"/>
    <circle cx="133.6" cy="327.8" r="1.27" class="star s5" opacity="0.24"/>
    <circle cx="93.9" cy="393.5" r="1.24" class="star s6" opacity="0.24"/>
    <circle cx="353.4" cy="385.6" r="1.21" class="star s3" opacity="0.67"/>
    <circle cx="160.9" cy="39.8" r="0.89" class="star s2" opacity="0.47"/>
    <circle cx="523.2" cy="155.6" r="0.9" class="star s6" opacity="0.55"/>
    <circle cx="1106.6" cy="211.4" r="1.35" class="star s3" opacity="0.66"/>
    <circle cx="488.2" cy="25.2" r="1.36" class="star s3" opacity="0.49"/>
    <circle cx="192.3" cy="400.3" r="0.92" class="star s3" opacity="0.4"/>
    <circle cx="207.7" cy="353.3" r="1.15" class="star s5" opacity="0.23"/>
    <circle cx="1078.3" cy="271.5" r="0.86" class="star s5" opacity="0.48"/>
    <circle cx="1177.4" cy="196.3" r="1.05" class="star s1" opacity="0.44"/>
    <circle cx="888.7" cy="304.8" r="1.49" class="star s6" opacity="0.64"/>
    <circle cx="901.4" cy="349.0" r="1.19" class="star s4" opacity="0.29"/>
    <circle cx="637.9" cy="84.8" r="1.4" class="star s3" opacity="0.4"/>
    <circle cx="674.5" cy="27.2" r="1.3" class="star s2" opacity="0.29"/>
    <g aria-hidden="true"><g class="syn y1"><line x1="1050" y1="66" x2="1102" y2="58"/><line x1="1050" y1="66" x2="1102" y2="84"/><line x1="1050" y1="66" x2="1102" y2="110"/><line x1="1050" y1="66" x2="1102" y2="136"/><line x1="1050" y1="96" x2="1102" y2="58"/><line x1="1050" y1="96" x2="1102" y2="84"/><line x1="1050" y1="96" x2="1102" y2="110"/><line x1="1050" y1="96" x2="1102" y2="136"/><line x1="1050" y1="126" x2="1102" y2="58"/><line x1="1050" y1="126" x2="1102" y2="84"/><line x1="1050" y1="126" x2="1102" y2="110"/><line x1="1050" y1="126" x2="1102" y2="136"/></g><g class="syn y2"><line x1="1102" y1="58" x2="1154" y2="84"/><line x1="1102" y1="58" x2="1154" y2="110"/><line x1="1102" y1="84" x2="1154" y2="84"/><line x1="1102" y1="84" x2="1154" y2="110"/><line x1="1102" y1="110" x2="1154" y2="84"/><line x1="1102" y1="110" x2="1154" y2="110"/><line x1="1102" y1="136" x2="1154" y2="84"/><line x1="1102" y1="136" x2="1154" y2="110"/></g><g class="node n1"><circle cx="1050" cy="66" r="1.8"/><circle cx="1050" cy="96" r="1.5"/><circle cx="1050" cy="126" r="1.7"/></g><g class="node n2"><circle cx="1102" cy="58" r="1.6"/><circle cx="1102" cy="84" r="1.9"/><circle cx="1102" cy="110" r="1.5"/><circle cx="1102" cy="136" r="1.7"/></g><g class="node n3"><circle cx="1154" cy="84" r="1.8"/><circle cx="1154" cy="110" r="1.6"/></g></g>
    <g class="attn" aria-hidden="true"><path class="arc a1" stroke-width="0.55" d="M1051 362Q1013 332 975 362"/><path class="arc a2" stroke-width="1.0" d="M1051 362Q1022 340 994 362"/><path class="arc a3" stroke-width="0.7" d="M1051 362Q1032 347 1013 362"/><path class="arc a4" stroke-width="0.85" d="M1051 362Q1070 347 1089 362"/><circle cx="975" cy="362" r="1.5" class="tok"/><circle cx="994" cy="362" r="1.5" class="tok"/><circle cx="1013" cy="362" r="1.5" class="tok"/><circle cx="1032" cy="362" r="1.5" class="tok"/><circle cx="1051" cy="362" r="2.1" class="tok q"/><circle cx="1070" cy="362" r="1.5" class="tok"/><circle cx="1089" cy="362" r="1.5" class="tok"/></g>
    <g transform="translate(628,14)"><g class="meteor m1">
      <line x1="-56" y1="-30" x2="0" y2="0" stroke="url(#tail)" stroke-width="1.3" stroke-linecap="round"/>
      <circle r="1.5" fill="#fff"/>
    </g></g>
    <g transform="translate(902,318)"><g class="meteor m2">
      <line x1="-44" y1="-23" x2="0" y2="0" stroke="url(#tail)" stroke-width="1.1" stroke-linecap="round"/>
      <circle r="1.2" fill="#fff"/>
    </g></g>
  </g>

  <g transform="translate(8,-4)" aria-hidden="true"><g class="moonWrap">
    <circle cx="238" cy="186" r="215" fill="url(#halo)"/>
    <use xlink:href="#moonArt" href="#moonArt" color="#c9c9c9" opacity=".4" filter="url(#glowSoft)"/>
    <rect x="16" y="16" width="470" height="380" fill="url(#moonFill)" mask="url(#moonMask)"/>
    <g transform="translate(242,200) rotate(-15) scale(1,.34)">
      <circle r="200" fill="none" stroke="#3a3a3a" stroke-opacity=".9"
              stroke-dasharray="2 8" vector-effect="non-scaling-stroke"/>
      <g class="orbitSpin"><g transform="translate(200,0) scale(1,2.941)">
        <circle r="6" fill="#fff" opacity=".22" filter="url(#glowDot)"/>
        <circle r="2.4" fill="#fff"/>
      </g></g>
    </g>
  </g></g>

  <rect width="1200" height="430" fill="url(#vig)"/>
  <line x1="500" y1="96" x2="500" y2="336" stroke="url(#divider)" stroke-width="1"/>

  <g>
    <g class="rise">
      <text x="568" y="118" class="prompt" textLength="70"><tspan class="sigil">$</tspan> whoami</text>
      <rect x="642" y="106" width="8" height="15" fill="#e8e8e8" class="cursor"/>
    </g>

    <g mask="url(#typeMask)">
      <text x="568" y="184" class="titleGlow" textLength="470"
            opacity=".22" filter="url(#glowTitle)">OUALA EDDINE</text>
      <text x="568" y="184" class="title" textLength="470">OUALA EDDINE</text>
    </g>

    <line x1="568" y1="222" x2="940" y2="222" class="rule" stroke="url(#ruleFill)"
          stroke-width="1" stroke-dasharray="372"/>

    <text x="568" y="256" class="meta rise r1" textLength="372">PRODUCTION PRODUCTS / TECHNICAL EXPERIMENTS</text>

    <g class="rise r2">
      <path d="M6.5 0a6.5 6.5 0 0 0-6.5 6.5C0 11.4 6.5 18 6.5 18S13 11.4 13 6.5A6.5 6.5 0 0 0 6.5 0zm0 9.2a2.7 2.7 0 1 1 0-5.4 2.7 2.7 0 0 1 0 5.4z"
            transform="translate(568,270)" fill="#6e6e6e"/>
      <text x="590" y="284" class="meta" textLength="138">ALGIERS, ALGERIA</text>
      <text x="746" y="284" class="coord" textLength="118">36.75°N · 3.06°E</text>
    </g>

    <text x="600" y="388" class="motto rise r3" textLength="460">DREAM TO REACH THE STARS → YOU WILL REACH THE MOON</text>
  </g>

  <rect width="1200" height="430" filter="url(#grain)" opacity=".045"
        style="mix-blend-mode:overlay" aria-hidden="true"/>
</g>

<rect x=".5" y=".5" width="1199" height="429" rx="23.5" fill="none" stroke="#2b2b2b"/>
</svg>